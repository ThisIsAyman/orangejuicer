name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [branch_pr_1, main]
    paths:
      - "web/**"
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & Build
        working-directory: web
        env:
          # Set repo variable OTF_PROXY_URL (Settings → Secrets and variables →
          # Actions → Variables) to your deployed Worker URL to enable live sync.
          VITE_OTF_PROXY_URL: ${{ vars.OTF_PROXY_URL }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
